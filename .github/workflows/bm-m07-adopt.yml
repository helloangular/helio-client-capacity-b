name: bm-m07-adopt
on:
  push:
    branches: [main, 'feature/**']
    paths: ['.github/workflows/bm-m07-adopt.yml', 'bm-m07/**']
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}
  pull_request:
    paths: ['bm-m07/**']
permissions:
  contents: read
concurrency:
  group: bm-m07-adopt-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: [self-hosted, helio-tomcat]
    timeout-minutes: 10
    steps:
      - name: BlueMatrix module 07 adoption fixture (build)
        shell: bash
        run: sleep 150
  test:
    needs: build
    runs-on: [self-hosted, helio-tomcat]
    timeout-minutes: 10
    steps:
      - name: BlueMatrix module 07 adoption fixture (test)
        shell: bash
        run: sleep 20
